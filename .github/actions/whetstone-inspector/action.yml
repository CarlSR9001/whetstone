name: Whetstone Inspector
description: Quarantine declared eval exposure and enforce a paired PASS/HOLD/BLOCK promotion decision.
inputs:
  exam:
    description: Exam JSON or JSONL path.
    required: true
  exposure:
    description: Declared training/exposure JSON or JSONL path.
    required: true
  baseline:
    description: Baseline item outcomes JSON or JSONL path.
    required: true
  candidate:
    description: Candidate item outcomes JSON or JSONL path.
    required: true
  receipt:
    description: Output JSON receipt path.
    required: false
    default: whetstone-promotion-receipt.json
  alpha:
    description: Paired exact-test alpha.
    required: false
    default: "0.05"
  min-gains:
    description: Minimum item-level gains.
    required: false
    default: "1"
  max-regressions:
    description: Maximum item-level regressions.
    required: false
    default: "0"
outputs:
  verdict:
    description: PASS, HOLD, or BLOCK.
    value: ${{ steps.inspect.outputs.verdict }}
  receipt:
    description: Receipt path.
    value: ${{ inputs.receipt }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - id: inspect
      shell: bash
      run: |
        set +e
        python -m bcv.cli inspect \
          --exam "$WHETSTONE_EXAM" \
          --exposure "$WHETSTONE_EXPOSURE" \
          --baseline "$WHETSTONE_BASELINE" \
          --candidate "$WHETSTONE_CANDIDATE" \
          --alpha "$WHETSTONE_ALPHA" \
          --min-gains "$WHETSTONE_MIN_GAINS" \
          --max-regressions "$WHETSTONE_MAX_REGRESSIONS" \
          --out "$RECEIPT"
        code=$?
        echo "$code" > .whetstone-exit-code
        if [[ -f "$RECEIPT" ]]; then
          python -c 'import json,os; r=json.load(open(os.environ["RECEIPT"], encoding="utf-8")); print("verdict="+r["gate"]["verdict"])' >> "$GITHUB_OUTPUT"
        else
          echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
        fi
        exit 0
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../src
        RECEIPT: ${{ inputs.receipt }}
        WHETSTONE_EXAM: ${{ inputs.exam }}
        WHETSTONE_EXPOSURE: ${{ inputs.exposure }}
        WHETSTONE_BASELINE: ${{ inputs.baseline }}
        WHETSTONE_CANDIDATE: ${{ inputs.candidate }}
        WHETSTONE_ALPHA: ${{ inputs.alpha }}
        WHETSTONE_MIN_GAINS: ${{ inputs['min-gains'] }}
        WHETSTONE_MAX_REGRESSIONS: ${{ inputs['max-regressions'] }}
    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: whetstone-promotion-receipt
        path: ${{ inputs.receipt }}
        if-no-files-found: error
    - shell: bash
      run: exit "$(cat .whetstone-exit-code)"

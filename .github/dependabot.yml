version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime-integrations:
        dependency-type: production
        patterns: ["*"]
      test-tooling:
        dependency-type: development
        patterns: ["*"]

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: provenance-attested release
    if: github.repository == 'CarlSR9001/whetstone'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Validate tag, changelog, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=src python -c 'from bcv._version import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          grep -Fq "## [${version}]" CHANGELOG.md
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Install release test environment
        run: uv sync --locked --extra test
      - name: Run audited release checks
        shell: pwsh
        run: uv run --no-sync pwsh -File ./scripts/release_check.ps1
      - name: Build immutable archive artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- dist
          source_root="${RUNNER_TEMP}/whetstone-release-source"
          source_tar="${RUNNER_TEMP}/whetstone-release-source.tar"
          mkdir -p "${source_root}" dist
          git archive --format=tar --output="${source_tar}" "${GITHUB_SHA}"
          tar -xf "${source_tar}" -C "${source_root}"
          uv build --out-dir "${GITHUB_WORKSPACE}/dist" "${source_root}"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          package_sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${wheel}"
          test -n "${package_sdist}"
          uv run --no-sync python scripts/clean_install_smoke.py \
            --wheel "${wheel}" \
            --expected-commit "${GITHUB_SHA}"
          git archive \
            --format=tar.gz \
            --prefix="whetstone-${GITHUB_REF_NAME}/" \
            --output="dist/whetstone-${GITHUB_REF_NAME}-source.tar.gz" \
            "${GITHUB_SHA}"
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          for artifact in dist/*.whl dist/*.tar.gz; do
            sbom="dist/$(basename "${artifact}").spdx.json"
            uv run --no-sync python scripts/build_release_sbom.py --artifact "${artifact}" --metadata-wheel "${wheel}" --created "${created}" --source-commit "${GITHUB_SHA}" --output "${sbom}"
            uv run --no-sync pyspdxtools --infile "${sbom}"
          done
          mkdir -p python-dist
          cp -- "${wheel}" "${package_sdist}" python-dist/
          cd dist
          sha256sum -- *.whl *.tar.gz *.spdx.json > SHA256SUMS
      - name: Retain Python distributions for Trusted Publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: python-dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "Whetstone ${GITHUB_REF_NAME}"
          --notes-file release-notes.md

  pypi:
    name: PyPI Trusted Publishing
    if: github.repository == 'CarlSR9001/whetstone' && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

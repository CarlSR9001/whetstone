name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: publication boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publication audit
        shell: pwsh
        run: ./scripts/audit_publication.ps1 -IncludeUntracked
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check origin/main...HEAD
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git diff-tree --check --root HEAD
            else
              git diff --check "${before}..HEAD"
            fi
          fi
          node --check src/bcv/toolbox_static/app.js
          bash -n deploy/install-release.sh deploy/publish.sh scripts/run_gen4_wsl.sh scripts/setup_gen4_wsl.sh
          pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "deploy/publish.ps1"), [ref]$null, [ref]$errors); if ($errors.Count) { throw $errors[0] }'
      - name: Verify immutable archive provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir archive-check
          git archive --format=tar --output=archive-check/release.tar HEAD
          tar -xf archive-check/release.tar -C archive-check
          embedded="$(
            python3 - archive-check/src/bcv/_version.py <<'PY'
          import importlib.util
          import os
          import sys

          os.environ.pop("WHETSTONE_BUILD_COMMIT", None)
          spec = importlib.util.spec_from_file_location("_release", sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.build_commit())
          PY
          )"
          test "$embedded" = "$GITHUB_SHA"

  pytest:
    name: full suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install full test environment
        run: uv sync --locked --extra test
      - name: Run suite
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider

  core:
    name: public core (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install public test environment
        run: uv sync --locked --extra test-core
      - name: Run public contract with coverage floor
        run: |
          uv run --no-sync python -m coverage run \
            --source=bcv.gate,bcv.product_tools,bcv.ephemeral,bcv.mcp_service,bcv.toolbox_service,bcv.stats \
            -m pytest -q -p no:cacheprovider \
            tests/test_cli.py tests/test_gate.py tests/test_mcp_and_report_card.py \
            tests/test_open_bench.py tests/test_product_tools.py tests/test_service.py \
            tests/test_receipts.py tests/test_stats.py tests/test_toolbox_service.py tests/test_version.py \
            tests/test_whetstone_mcp.py
          uv run --no-sync python -m coverage report --fail-under=80

  mcp-conformance:
    name: MCP 2026 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Whetstone core
        run: uv sync --locked
      - name: Run official MCP conformance scenarios
        shell: bash
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/whetstone-state"
          log="${RUNNER_TEMP}/whetstone-mcp.log"
          mkdir -p "${state_dir}" conformance-results
          WHETSTONE_STATE_DIR="${state_dir}" \
            uv run --no-sync python -m bcv.toolbox_service --host 127.0.0.1 --port 8988 >"${log}" 2>&1 &
          server_pid=$!
          cleanup() {
            rc=$?
            if (( rc != 0 )); then cat "${log}"; fi
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            trap - EXIT
            exit "${rc}"
          }
          trap cleanup EXIT
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8988/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = 1
          for scenario in server-stateless tools-list caching http-header-validation; do
            npx -y @modelcontextprotocol/conformance@0.2.0-alpha.11 server \
              --url http://127.0.0.1:8988/mcp \
              --scenario "${scenario}" \
              --spec-version 2026-07-28 \
              --expected-failures conformance-baseline.yml \
              --output-dir "conformance-results/${scenario}"
          done

  wheel:
    name: clean wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Exercise Windows deployment archive preflight
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        run: ./deploy/publish.ps1 -LocalPreflightOnly -GitRef HEAD
      - name: Build wheel
        run: |
          uv sync --locked --extra test-core
          uv build
      - name: Smoke clean install without optional dependencies
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          uv run --no-sync python scripts/clean_install_smoke.py --wheel $wheel.FullName
      - name: Retain canonical wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whetstone-wheel
          path: dist/*

  required:
    name: required
    if: always()
    needs: [publication, pytest, core, mcp-conformance, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm every required job succeeded
        shell: bash
        run: |
          test "${{ needs.publication.result }}" = success
          test "${{ needs.pytest.result }}" = success
          test "${{ needs.core.result }}" = success
          test "${{ needs.mcp-conformance.result }}" = success
          test "${{ needs.wheel.result }}" = success

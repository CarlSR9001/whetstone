server {
    listen 80;
    listen [::]:80;
    server_name whetstone.cyberelf.link;

    access_log /var/log/nginx/whetstone-tools-access.log;
    error_log /var/log/nginx/whetstone-tools-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/whetstone-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Certificate bootstrap only. The tool is exposed after the dedicated TLS
    # certificate has been issued and the final vhost validates.
    location / {
        return 503;
    }
}

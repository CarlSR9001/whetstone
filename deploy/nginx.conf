server {
    listen 80;
    listen [::]:80;
    server_name whetstone.cyberelf.link;

    access_log /var/log/nginx/whetstone-tools-access.log;
    error_log /var/log/nginx/whetstone-tools-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/whetstone-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whetstone.cyberelf.link;

    ssl_certificate /etc/letsencrypt/live/whetstone.cyberelf.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whetstone.cyberelf.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WhetstoneTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/whetstone-tools-access.log;
    error_log /var/log/nginx/whetstone-tools-error.log warn;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /mcp {
        limit_req zone=whetstone_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8988;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_hide_header Server;
    }

    location ^~ /api/ {
        limit_req zone=whetstone_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8988;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://127.0.0.1:8988;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_hide_header Server;
    }
}

[project]
name = "branching-continual-verification"
dynamic = ["version"]
description = "Verifier-grounded private exam banks and auditable AI promotion gates."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Justin Garringer" }]
keywords = ["evaluation", "llm", "promotion-gate", "continual-learning", "contamination"]
classifiers = [
  # License is declared as an SPDX expression above (PEP 639); a license
  # classifier alongside it is rejected by modern setuptools.
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://whetstone.cyberelf.link/"
Documentation = "https://github.com/CarlSR9001/whetstone#readme"
Repository = "https://github.com/CarlSR9001/whetstone"
Issues = "https://github.com/CarlSR9001/whetstone/issues"
Changelog = "https://github.com/CarlSR9001/whetstone/blob/main/CHANGELOG.md"

[project.optional-dependencies]
agents = [
  "mcp>=2,<3",
]
engines = [
  "python-chess>=1.999",
]
local-models = [
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "sentencepiece",
]
all = [
  "mcp>=2,<3",
  "python-chess>=1.999",
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "sentencepiece",
]
test = [
  "build>=1.2",
  "pytest>=8",
  "spdx-tools>=0.8,<0.9",
  "mcp>=2,<3",
  "python-chess>=1.999",
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "sentencepiece",
]
test-core = [
  "coverage>=7.6",
  "pytest>=8",
  "spdx-tools>=0.8,<0.9",
  "mcp>=2,<3",
  "python-chess>=1.999",
]

[project.scripts]
whetstone = "bcv.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "bcv._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bcv = ["toolbox_static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

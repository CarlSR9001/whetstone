[project]
name = "branching-continual-verification"
version = "0.1.0"
description = "Verifier-grounded private exam banks and auditable AI promotion gates."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Justin Garringer" }]
keywords = ["evaluation", "llm", "promotion-gate", "continual-learning", "contamination"]
classifiers = [
  # License is declared as an SPDX expression above (PEP 639); a license
  # classifier alongside it is rejected by modern setuptools.
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "sentencepiece",
  "mcp>=1.0",
  "python-chess>=1.999",
]

[project.scripts]
whetstone = "bcv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

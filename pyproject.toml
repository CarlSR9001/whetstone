[project]
name = "branching-continual-verification"
version = "0.1.0"
description = "Verifier-grounded private exam banks and auditable AI promotion gates."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "sentencepiece",
  "mcp>=1.0",
  "python-chess>=1.999",
]

[project.scripts]
whetstone = "bcv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
